<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap"
            rel="stylesheet"
        />

        <!--=============== CSS ===============-->
        <link rel="stylesheet" href="./assets/css/style.css" />

        <title>PAPERTRIP — Follow your curiosity</title>
    </head>

    <body class="is-loading">
        <div class="loader" aria-label="Loading Papertrip">
            <div class="loader-before"></div>
            <div class="loader-inner">
                <svg
                    class="loader-plane"
                    viewBox="0 0 180 130"
                    role="img"
                    aria-label="Paper airplane"
                >
                    <path
                        d="M12 57 167 8 101 119 82 76Z"
                        fill="#fff9ec"
                        stroke="#d6e7e8"
                        stroke-width="2"
                        stroke-linejoin="round"
                    />
                    <path d="M12 57 82 76 167 8Z" fill="#ffffff" />
                    <path d="M82 76 101 119 111 62 167 8Z" fill="#e8ddc9" />
                    <path d="M82 76 111 62" stroke="#c8dce0" stroke-width="2" />
                </svg>

                <div class="loader-brand">Papertrip</div>
                <div class="loader-track">
                    <div class="loader-progress"></div>
                </div>

                <div class="loader-count">
                    PREPARING YOUR JOURNEY <span>00</span>%
                </div>
            </div>
        </div>

        <main class="site">
            <section class="hero" id="home">
                <header class="nav">
                    <a class="brand" href="#home" aria-label="Papertrip home">
                        <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
                            <path
                                d="M4 18 35 5 22 35 17 22Z"
                                stroke="currentColor"
                                stroke-width="2.2"
                                stroke-linejoin="round"
                            />
                            <path
                                d="M4 18 17 22 35 5 17 22 22 35"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linejoin="round"
                            />
                        </svg>
                        PAPERTRIP
                    </a>

                    <button
                        class="menu-toggle"
                        aria-label="Toggle navigation"
                        aria-expanded="false"
                    >
                        <span>☰</span>
                    </button>

                    <nav class="nav-links">
                        <a href="#">Home</a>
                        <a href="#">About</a>
                        <a href="#">Destinations</a>
                        <a href="#">Contact</a>
                    </nav>
                </header>

                <div class="hero-copy">
                    <div class="eyebrow">
                        <span>Discover</span>
                        <span class="dot"></span>
                        <span>Explore</span>
                        <span class="dot"></span>
                        <span>Travel</span>
                    </div>

                    <h1>
                        <span class="line">Big dreams</span>
                        <span class="line">need a <em>direction.</em></span>
                    </h1>

                    <p class="hero-description">
                        Pack your curiosity. The world is waiting. Let's go
                        somewhere wonderful.
                    </p>

                    <div class="hero-actions">
                        <a class="cta" href="#">
                            Explore
                            <svg viewBox="0 0 24 24" fill="none">
                                <path
                                    d="M4 12h15m-6-6 6 6-6 6"
                                    stroke="currentColor"
                                    stroke-width="1.5"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                            </svg>
                        </a>

                        <span class="small-note">
                            Your next chapter<br />starts here
                        </span>
                    </div>
                </div>

                <div class="artboard" aria-hidden="true">
                    <svg class="sun floaty" viewBox="0 0 220 220">
                        <g
                            stroke="#ffc65e"
                            stroke-width="9"
                            stroke-linecap="square"
                        >
                            <path
                                d="M110 8v22M110 190v22M8 110h22M190 110h22M38 38l16 16M166 166l16 
                                16M182 38l-16 16M54 166l-16 16"
                            />
                        </g>
                        <circle
                            cx="110"
                            cy="110"
                            r="70"
                            fill="#ffc65e"
                            stroke="#f4b84c"
                            stroke-width="2"
                        />
                        <path
                            d="M63 91c18-22 40-29 66-25"
                            fill="none"
                            stroke="#ffe4a0"
                            stroke-width="3"
                            stroke-linecap="round"
                            opacity=".8"
                        />
                    </svg>

                    <!-- CSS paper clouds -->
                    <div class="cloud cloud-a floaty"></div>
                    <div class="cloud cloud-b floaty"></div>
                    <div class="cloud cloud-c floaty"></div>

                    <svg class="flight-path" viewBox="0 0 700 450">
                        <path
                            d="M12 425C170 360 220 265 360 225S550 110 680 20"
                        />
                    </svg>

                    <div class="plane-wrap">
                        <svg class="plane" viewBox="0 0 620 400">
                            <path
                                d="M25 167 590 20 357 374 292 224Z"
                                fill="#fff9ec"
                                stroke="#e6e0d4"
                                stroke-width="3"
                                stroke-linejoin="round"
                            />

                            <path d="M25 167 292 224 590 20Z" fill="#ffffff" />

                            <path
                                d="M292 224 357 374 390 174 590 20Z"
                                fill="#e9decb"
                            />

                            <path
                                d="M292 224 390 174"
                                fill="none"
                                stroke="#c9dfe4"
                                stroke-width="3"
                            />

                            <path
                                d="M25 167 292 224 357 374"
                                fill="none"
                                stroke="#f5ead8"
                                stroke-width="2"
                            />

                            <path
                                d="M292 224 590 20 390 174"
                                fill="none"
                                stroke="#d4e4e5"
                                stroke-width="2"
                            />
                        </svg>
                    </div>

                    <svg class="balloon balloon-a floaty" viewBox="0 0 140 220">
                        <path
                            d="M70 8C28 8 7 43 13 82c5 33 28 58 43 81h28c15-23 
                            38-48 43-81C133 43 112 8 70 8Z"
                            fill="#fff4df"
                            stroke="#d9e7e4"
                            stroke-width="2"
                        />
                        <path
                            d="M70 8C48 8 37 33 42 64l14 99h14V8Z"
                            fill="#ffc65e"
                        />
                        <path
                            d="M70 8c25 0 37 26 32 56l-13 99H70Z"
                            fill="#f6e2bd"
                        />
                        <path
                            d="M13 82c5 33 28 58 43 81h28c15-23 38-48 43-81"
                            fill="none"
                            stroke="#d4e3e0"
                            stroke-width="2"
                        />
                        <path d="M57 163h26l-3 18H60Z" fill="#b87945" />
                        <path d="M60 181h20l-4 12H64Z" fill="#8c5b3d" />
                        <path
                            d="M56 163 61 181M84 163 79 181"
                            stroke="#8c5b3d"
                            stroke-width="1.5"
                        />
                    </svg>

                    <svg class="balloon balloon-b floaty" viewBox="0 0 140 220">
                        <path
                            d="M70 8C28 8 7 43 13 82c5 33 28 58 43 81h28c15-23 
                            38-48 43-81C133 43 112 8 70 8Z"
                            fill="#fdf3dd"
                            stroke="#d9e7e4"
                            stroke-width="2"
                        />
                        <path
                            d="M70 8C48 8 37 33 42 64l14 99h14V8Z"
                            fill="#5bb8d7"
                        />
                        <path
                            d="M70 8c25 0 37 26 32 56l-13 99H70Z"
                            fill="#ffc65e"
                        />
                        <path d="M57 163h26l-3 18H60Z" fill="#b87945" />
                        <path d="M60 181h20l-4 12H64Z" fill="#8c5b3d" />
                    </svg>

                    <svg class="bird bird-a" viewBox="0 0 80 45">
                        <path
                            d="M4 26Q21 6 39 27Q55 7 76 10"
                            fill="none"
                            stroke="#fff8e9"
                            stroke-width="4"
                            stroke-linecap="round"
                        />
                    </svg>

                    <svg class="bird bird-b" viewBox="0 0 80 45">
                        <path
                            d="M4 26Q21 6 39 27Q55 7 76 10"
                            fill="none"
                            stroke="#fff8e9"
                            stroke-width="4"
                            stroke-linecap="round"
                        />
                    </svg>
                </div>

                <div class="bottom-label">A little paper. A lot of world.</div>

                <a class="scroll-cue" href="#about">
                    <span class="mouse"></span><span>Scroll to wander</span>
                </a>
            </section>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>

        <script src="./assets/js/main.js"></script>
    </body>
</html>
