<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap"
            rel="stylesheet"
        />

        <!--=============== CSS ===============-->
        <link rel="stylesheet" href="./assets/css/style.css" />

        <title>PAPERTRIP — Follow your curiosity</title>
    </head>

    <body class="is-loading">
        <div class="loader" aria-label="Loading Papertrip">
            <div class="loader-before"></div>
            <div class="loader-inner">
                <svg
                    class="loader-plane"
                    viewBox="0 0 180 130"
                    role="img"
                    aria-label="Paper airplane"
                >
                    <path
                        d="M12 57 167 8 101 119 82 76Z"
                        fill="#fff9ec"
                        stroke="#d6e7e8"
                        stroke-width="2"
                        stroke-linejoin="round"
                    />
                    <path d="M12 57 82 76 167 8Z" fill="#ffffff" />
                    <path d="M82 76 101 119 111 62 167 8Z" fill="#e8ddc9" />
                    <path d="M82 76 111 62" stroke="#c8dce0" stroke-width="2" />
                </svg>

                <div class="loader-brand">Papertrip</div>
                <div class="loader-track">
                    <div class="loader-progress"></div>
                </div>

                <div class="loader-count">
                    PREPARING YOUR JOURNEY <span>00</span>%
                </div>
            </div>
        </div>

        <main class="site">
            <section class="hero" id="home">
                <header class="nav">
                    <a class="brand" href="#home" aria-label="Papertrip home">
                        <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
                            <path
                                d="M4 18 35 5 22 35 17 22Z"
                                stroke="currentColor"
                                stroke-width="2.2"
                                stroke-linejoin="round"
                            />
                            <path
                                d="M4 18 17 22 35 5 17 22 22 35"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linejoin="round"
                            />
                        </svg>
                        PAPERTRIP
                    </a>

                    <button
                        class="menu-toggle"
                        aria-label="Toggle navigation"
                        aria-expanded="false"
                    >
                        <span>☰</span>
                    </button>

                    <nav class="nav-links">
                        <a href="#">Home</a>
                        <a href="#">About</a>
                        <a href="#">Destinations</a>
                        <a href="#">Contact</a>
                    </nav>
                </header>

                <div class="hero-copy">
                    <div class="eyebrow">
                        <span>Discover</span>
                        <span class="dot"></span>
                        <span>Explore</span>
                        <span class="dot"></span>
                        <span>Travel</span>
                    </div>

                    <h1>
                        <span class="line">Big dreams</span>
                        <span class="line">need a <em>direction.</em></span>
                    </h1>

                    <p class="hero-description">
                        Pack your curiosity. The world is waiting. Let's go
                        somewhere wonderful.
                    </p>

                    <div class="hero-actions">
                        <a class="cta" href="#">
                            Explore
                            <svg viewBox="0 0 24 24" fill="none">
                                <path
                                    d="M4 12h15m-6-6 6 6-6 6"
                                    stroke="currentColor"
                                    stroke-width="1.5"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                            </svg>
                        </a>

                        <span class="small-note">
                            Your next chapter<br />starts here
                        </span>
                    </div>
                </div>

                <!-- Distant paper mountains -->
                <div
                    class="paper-landscape paper-landscape-back"
                    aria-hidden="true"
                >
                    <svg
                        class="mountain-scene"
                        viewBox="0 0 1440 520"
                        preserveAspectRatio="none"
                    >
                        <defs>
                            <filter
                                id="paper-shadow"
                                x="-20%"
                                y="-20%"
                                width="140%"
                                height="150%"
                            >
                                <feDropShadow
                                    dx="0"
                                    dy="9"
                                    stdDeviation="7"
                                    flood-color="#174c62"
                                    flood-opacity=".16"
                                />
                            </filter>
                        </defs>

                        <!-- Far range: pale, distant and atmospheric -->
                        <g class="mountain-far" filter="url(#paper-shadow)">
                            <path
                                d="M0 365 170 155 275 275 420 100 590 340 760 165
                     900 300 1080 110 1260 300 1370 185 1440 265
                     V520 H0Z"
                                fill="#c7e1c4"
                            />

                            <!-- Folded mountain facets -->
                            <path
                                d="M170 155 205 260 275 275Z"
                                fill="#e5f1d9"
                            />
                            <path
                                d="M420 100 455 245 590 340Z"
                                fill="#dcebd1"
                            />
                            <path
                                d="M760 165 800 285 900 300Z"
                                fill="#b0d6b7"
                            />
                            <path
                                d="M1080 110 1120 240 1260 300Z"
                                fill="#e3efd8"
                            />
                            <path
                                d="M1370 185 1390 260 1440 265Z"
                                fill="#d7e9cd"
                            />
                        </g>

                        <!-- Middle range -->
                        <g class="mountain-mid" filter="url(#paper-shadow)">
                            <path
                                d="M0 420 155 275 280 375 470 205 650 405
                     815 270 1000 425 1180 255 1360 385
                     1440 320 V520 H0Z"
                                fill="#80b58a"
                            />

                            <path
                                d="M155 275 190 350 280 375Z"
                                fill="#a8cfa1"
                            />
                            <path
                                d="M470 205 510 330 650 405Z"
                                fill="#9bc69a"
                            />
                            <path
                                d="M815 270 860 375 1000 425Z"
                                fill="#639d78"
                            />
                            <path
                                d="M1180 255 1225 350 1360 385Z"
                                fill="#a3ca9c"
                            />
                        </g>

                        <!-- Rolling paper hills -->
                        <g class="paper-hills">
                            <path
                                d="M0 410 Q200 340 390 405 T790 400
                     T1160 385 T1440 370 V520 H0Z"
                                fill="#a6d99a"
                            />

                            <path
                                d="M0 455 Q220 365 450 435
                     T890 425 T1250 415 T1440 430
                     V520 H0Z"
                                fill="#69b875"
                            />

                            <path
                                d="M0 485 Q250 420 480 465
                     T930 460 T1440 450 V520 H0Z"
                                fill="#39865b"
                            />
                        </g>
                    </svg>
                </div>

                <div class="artboard" aria-hidden="true">
                    <div class="sun-wrap">
                        <svg class="sun floaty" viewBox="0 0 220 220">
                            <g
                                stroke="#ffc65e"
                                stroke-width="9"
                                stroke-linecap="square"
                            >
                                <path
                                    d="M110 8v22M110 190v22M8 110h22M190 110h22M38 38l16 16M166 166l16 
                                16M182 38l-16 16M54 166l-16 16"
                                />
                            </g>
                            <circle
                                cx="110"
                                cy="110"
                                r="70"
                                fill="#ffc65e"
                                stroke="#f4b84c"
                                stroke-width="2"
                            />
                            <path
                                d="M63 91c18-22 40-29 66-25"
                                fill="none"
                                stroke="#ffe4a0"
                                stroke-width="3"
                                stroke-linecap="round"
                                opacity=".8"
                            />
                        </svg>
                    </div>

                    <!-- CSS paper clouds -->
                    <div class="cloud cloud-a"></div>
                    <div class="cloud cloud-b"></div>
                    <div class="cloud cloud-c"></div>

                    <svg class="flight-path" viewBox="0 0 700 450">
                        <path
                            d="M12 425C170 360 220 265 360 225S550 110 680 20"
                        />
                    </svg>

                    <div class="plane-wrap">
                        <div class="plane-float">
                            <svg class="plane" viewBox="0 0 620 400">
                                <path
                                    d="M25 167 590 20 357 374 292 224Z"
                                    fill="#fff9ec"
                                    stroke="#e6e0d4"
                                    stroke-width="3"
                                    stroke-linejoin="round"
                                />

                                <path
                                    d="M25 167 292 224 590 20Z"
                                    fill="#ffffff"
                                />

                                <path
                                    d="M292 224 357 374 390 174 590 20Z"
                                    fill="#e9decb"
                                />

                                <path
                                    d="M292 224 390 174"
                                    fill="none"
                                    stroke="#c9dfe4"
                                    stroke-width="3"
                                />

                                <path
                                    d="M25 167 292 224 357 374"
                                    fill="none"
                                    stroke="#f5ead8"
                                    stroke-width="2"
                                />

                                <path
                                    d="M292 224 590 20 390 174"
                                    fill="none"
                                    stroke="#d4e4e5"
                                    stroke-width="2"
                                />
                            </svg>
                        </div>
                    </div>

                    <div class="balloon balloon-a">
                        <div class="balloon-float">
                            <svg
                                class="balloon balloon-a floaty"
                                viewBox="0 0 140 220"
                            >
                                <path
                                    d="M70 8C28 8 7 43 13 82c5 33 28 58 43 81h28c15-23 
                                        38-48 43-81C133 43 112 8 70 8Z"
                                    fill="#fff4df"
                                    stroke="#d9e7e4"
                                    stroke-width="2"
                                />
                                <path
                                    d="M70 8C48 8 37 33 42 64l14 99h14V8Z"
                                    fill="#ffc65e"
                                />
                                <path
                                    d="M70 8c25 0 37 26 32 56l-13 99H70Z"
                                    fill="#f6e2bd"
                                />
                                <path
                                    d="M13 82c5 33 28 58 43 81h28c15-23 38-48 43-81"
                                    fill="none"
                                    stroke="#d4e3e0"
                                    stroke-width="2"
                                />
                                <path d="M57 163h26l-3 18H60Z" fill="#b87945" />
                                <path d="M60 181h20l-4 12H64Z" fill="#8c5b3d" />
                                <path
                                    d="M56 163 61 181M84 163 79 181"
                                    stroke="#8c5b3d"
                                    stroke-width="1.5"
                                />
                            </svg>
                        </div>
                    </div>

                    <div class="balloon balloon-b">
                        <div class="balloon-float">
                            <svg
                                class="balloon balloon-b floaty"
                                viewBox="0 0 140 220"
                            >
                                <path
                                    d="M70 8C28 8 7 43 13 82c5 33 28 58 43 81h28c15-23 
                                        38-48 43-81C133 43 112 8 70 8Z"
                                    fill="#fdf3dd"
                                    stroke="#d9e7e4"
                                    stroke-width="2"
                                />
                                <path
                                    d="M70 8C48 8 37 33 42 64l14 99h14V8Z"
                                    fill="#5bb8d7"
                                />
                                <path
                                    d="M70 8c25 0 37 26 32 56l-13 99H70Z"
                                    fill="#ffc65e"
                                />
                                <path d="M57 163h26l-3 18H60Z" fill="#b87945" />
                                <path d="M60 181h20l-4 12H64Z" fill="#8c5b3d" />
                            </svg>
                        </div>
                    </div>

                    <svg class="bird bird-a" viewBox="0 0 80 45">
                        <path
                            d="M4 26Q21 6 39 27Q55 7 76 10"
                            fill="none"
                            stroke="#fff8e9"
                            stroke-width="4"
                            stroke-linecap="round"
                        />
                    </svg>

                    <svg class="bird bird-b" viewBox="0 0 80 45">
                        <path
                            d="M4 26Q21 6 39 27Q55 7 76 10"
                            fill="none"
                            stroke="#fff8e9"
                            stroke-width="4"
                            stroke-linecap="round"
                        />
                    </svg>
                </div>

                <!-- Foreground paper forest -->
                <div
                    class="paper-landscape paper-landscape-front"
                    aria-hidden="true"
                >
                    <svg viewBox="0 0 1440 300" preserveAspectRatio="none">
                        <defs>
                            <filter
                                id="grass-shadow"
                                x="-20%"
                                y="-20%"
                                width="140%"
                                height="160%"
                            >
                                <feDropShadow
                                    dx="0"
                                    dy="-5"
                                    stdDeviation="5"
                                    flood-color="#174c36"
                                    flood-opacity=".2"
                                />
                            </filter>
                        </defs>

                        <!-- Back tree line -->
                        <g
                            class="tree-row tree-row-back"
                            filter="url(#grass-shadow)"
                            fill="#327d53"
                        >
                            <path d="M110 175 135 125 160 175Z" />
                            <path d="M115 150 135 105 155 150Z" />
                            <path d="M130 174V195H140V174Z" fill="#a17c50" />

                            <path d="M330 185 360 120 390 185Z" />
                            <path d="M337 150 360 90 383 150Z" />
                            <path d="M355 184V207H365V184Z" fill="#a17c50" />

                            <path d="M1080 180 1110 115 1140 180Z" />
                            <path d="M1088 148 1110 85 1132 148Z" />
                            <path d="M1105 179V205H1115V179Z" fill="#a17c50" />

                            <path d="M1290 190 1315 135 1340 190Z" />
                            <path d="M1297 160 1315 110 1333 160Z" />
                            <path d="M1311 189V210H1319V189Z" fill="#a17c50" />
                        </g>

                        <!-- Main foreground grass -->
                        <g class="grass-layer" filter="url(#grass-shadow)">
                            <path
                                d="M0 200 Q200 135 420 195
                     T840 185 T1200 175 T1440 165
                     V300 H0Z"
                                fill="#39865b"
                            />

                            <path
                                d="M0 245 Q180 180 400 230
                     T820 225 T1200 205 T1440 220
                     V300 H0Z"
                                fill="#286c49"
                            />

                            <!-- Angular blades: left -->
                            <path
                                d="M0 252 22 214 18 255 44 226 36 265
                     60 235 55 270 78 245 72 278 100 248
                     90 282 118 257 110 290 0 300Z"
                                fill="#20583f"
                            />

                            <!-- Angular blades: right -->
                            <path
                                d="M1440 230 1410 190 1418 242
                     1385 210 1398 257 1365 225
                     1378 269 1345 240 1358 280
                     1318 250 1330 290 1440 300Z"
                                fill="#20583f"
                            />
                        </g>

                        <!-- Folded trees closer to the viewer -->
                        <g
                            class="tree-row tree-row-front"
                            filter="url(#grass-shadow)"
                        >
                            <g transform="translate(190 95)">
                                <path d="M0 110 45 20 90 110Z" fill="#174e37" />
                                <path d="M0 110 45 20 45 110Z" fill="#368b58" />
                                <path d="M14 80 45 38 45 80Z" fill="#62ae70" />
                                <path d="M45 20 70 80 45 80Z" fill="#256b46" />
                                <path d="M37 110V145H53V110Z" fill="#9a714a" />
                            </g>

                            <g transform="translate(1160 120) scale(.8)">
                                <path d="M0 110 45 20 90 110Z" fill="#174e37" />
                                <path d="M0 110 45 20 45 110Z" fill="#368b58" />
                                <path d="M14 80 45 38 45 80Z" fill="#62ae70" />
                                <path d="M45 20 70 80 45 80Z" fill="#256b46" />
                                <path d="M37 110V145H53V110Z" fill="#9a714a" />
                            </g>
                        </g>

                        <!-- Small paper grass details -->
                        <g class="grass-details" fill="#9bd58a">
                            <path d="M100 286 110 258 108 286Z" />
                            <path d="M130 294 146 265 138 294Z" />
                            <path d="M270 292 280 265 278 294Z" />
                            <path d="M1010 290 1025 260 1018 294Z" />
                            <path d="M1050 294 1065 272 1060 294Z" />
                            <path d="M1270 291 1280 260 1280 294Z" />
                        </g>
                    </svg>
                </div>

                <div class="bottom-label">A little paper. A lot of world.</div>

                <a class="scroll-cue" href="#about">
                    <span class="mouse"></span><span>Scroll to wander</span>
                </a>
            </section>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>

        <script src="./assets/js/main.js"></script>
    </body>
</html>
